<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题库管理 · 你画我猜</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#24324b;margin:0;padding:20px}main{max-width:720px;margin:auto}.card{background:white;border-radius:16px;padding:20px;margin:14px 0;border:1px solid #e3e8f0}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;margin:7px 0 12px}button{background:#356be6;color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:600;margin:4px;cursor:pointer}.secondary{background:#edf2ff;color:#2755ba}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:7px;align-items:center}.row input{flex:1;min-width:0}.row button{flex-shrink:0}#list{max-height:380px;overflow:auto}small,p{color:#667085}#msg{white-space:pre-wrap}a{color:#315fc6}</style></head><body><main><h1>🔐 你画我猜 · 题库管理</h1><p><a href="/">返回游戏</a> · 管理员专用</p><section class="card" id="login"><h2>管理员登录</h2><form id="loginForm"><label>账号<input id="username" value="admin" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section><section id="panel" hidden><div class="card"><button id="logout" class="secondary">退出登录</button><h2>管理题库</h2><select id="mode"><option value="normal">普通模式</option><option value="script">剧本杀模式</option></select><button id="refresh" class="secondary">重新加载</button><p id="count"></p><input id="search" placeholder="搜索词语"><div id="list"></div><h3>添加单个词语</h3><div class="row"><input id="newWord" placeholder="输入词语"><button id="add">添加</button></div><h3>批量导入</h3><p>每行一个词，也可使用逗号、顿号或分号分隔。自动去重。</p><textarea id="bulk" rows="5" placeholder="长颈鹿&#10;新加坡&#10;冰淇淋"></textarea><button id="import" class="secondary">导入词语</button><hr><button id="save">保存到 GitHub</button><p>保存成功后，当前服务器的新游戏会使用更新的题库；Render 自动部署可能重启正在进行的房间。</p></div></section><p id="msg" role="status"></p></main><script src="/admin.js"></script></body></html>
