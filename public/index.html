<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>你画我猜 · 好友联机</title><link rel="stylesheet" href="/style.css"></head><body><main><header><h1>🎨 你画我猜</h1><span id="connection">连接中</span></header><section id="entry" class="card"><h2>和朋友一起画画猜词</h2><label>你的昵称<input id="nickname" maxlength="16" placeholder="输入昵称"></label><button id="create">创建房间</button><div class="or">或者加入好友的房间</div><label>六位房间号<input id="roomInput" inputmode="numeric" maxlength="6" placeholder="123456"></label><button id="join" class="secondary">加入房间</button></section><div style="text-align:center;margin:14px 0 20px"><a href="/admin.html" style="font-size:13px;color:#667085;text-decoration:none">🔐 管理员专用入口</a></div><section id="game" hidden><div class="card"><div class="top"><strong>房间 <span id="roomCode"></span></strong><span id="phaseText"></span></div><div class="actions"><button id="share" class="secondary">邀请好友</button><button id="leave" class="ghost">离开</button></div><div class="meta"><span>第 <b id="round">0</b>/<b id="maxRoundsLabel">4</b> 幅</span><span id="count">0/8</span><span id="timer">--</span></div><div id="roleInfo"></div><form id="relayGuessForm" hidden><input id="relayGuessInput" maxlength="80" placeholder="最后一位玩家，请输入猜测"><button>提交最终答案</button></form><h3 id="wordInfo"></h3><div id="modePanel"><label>游戏模式 <select id="modeSelect"><option value="normal">普通模式（随机题库）</option><option value="custom">自定义模式（玩家出题）</option><option value="script">剧本杀（独立词库）</option><option value="idiom">成语模式（常用成语）</option></select></label><div id="relaySettings"><label>玩法 <select id="playStyle"><option value="classic">经典你画我猜</option><option value="relay">画猜接龙（至少3人）</option></select></label><label id="watchLabel" hidden>观看上一幅画的时间 <select id="watchSeconds"><option value="5">5 秒</option><option value="10">10 秒</option><option value="15" selected>15 秒</option><option value="20">20 秒</option><option value="30">30 秒</option></select></label><p id="relayHint" style="font-size:12px;color:#667085" hidden>每人仅看上一位玩家的画；观看结束后画面清空，再独立绘画。最后一位负责猜词。</p></div><div id="roundSettings"><label>每位玩家画几次 <select id="maxRounds"><option value="1">1 次</option><option value="2" selected>2 次</option><option value="3">3 次</option><option value="5">5 次</option><option value="10">10 次</option></select></label><label>每幅画作画时长 <select id="drawSeconds"><option value="30">30 秒</option><option value="60">60 秒</option><option value="90" selected>90 秒</option><option value="120">120 秒</option></select></label><p style="font-size:12px;color:#667085">所有玩家轮流作画，每人达到设定次数后结束。例如4人每人画3次，共12幅画。</p></div><div id="customPanel" hidden><p>每位玩家都可以出题。每行一个词，提交后其他人看不到答案。</p><textarea id="customInput" rows="4" maxlength="1000" placeholder="长颈鹿&#10;新加坡&#10;冰淇淋"></textarea><button id="addWords" class="secondary">提交词语</button><p id="customCount"></p></div></div><button id="start">开始游戏</button></div><div class="card canvaswrap"><canvas id="board" width="600" height="650"></canvas><div id="overlay">等待开始</div><div id="tools" hidden><label>颜色 <input type="color" id="color" value="#111827"></label><label>粗细 <input type="range" id="size" min="2" max="24" value="5"></label><button id="eraser" class="secondary">橡皮擦</button><button id="clear" class="ghost">清空</button></div></div><div class="card"><h3>🏆 玩家排行</h3><div id="players"></div></div><div class="card"><h3>💬 猜词聊天</h3><div id="messages"></div><form id="guessForm"><input id="guessInput" placeholder="输入答案"><button>发送</button></form></div></section><div id="toast"></div></main><script src="/game.js"></script></body></html>
