<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>你画我猜 · 好友联机</title><link rel="stylesheet" href="/style.css"></head><body><main><header><h1>🎨 你画我猜</h1><span id="connection">连接中</span></header><section id="entry" class="card"><h2>和朋友一起画画猜词</h2><label>你的昵称<input id="nickname" maxlength="16" placeholder="输入昵称"></label><button id="create">创建房间</button><div class="or">或者加入好友的房间</div><label>六位房间号<input id="roomInput" inputmode="numeric" maxlength="6" placeholder="123456"></label><button id="join" class="secondary">加入房间</button></section><section id="game" hidden><div class="card"><div class="top"><strong>房间 <span id="roomCode"></span></strong><span id="phaseText"></span></div><div class="actions"><button id="share" class="secondary">邀请好友</button><button id="leave" class="ghost">离开</button></div><div class="meta"><span>第 <b id="round">0</b> 轮</span><span id="count">0/8</span><span id="timer">--</span></div><div id="roleInfo"></div><h3 id="wordInfo"></h3><div id="modePanel"><label>游戏模式 <select id="modeSelect"><option value="normal">普通模式（随机题库）</option><option value="custom">自定义模式（玩家出题）</option><option value="script">剧本杀（独立词库）</option></select></label><div id="customPanel" hidden><p>每位玩家都可以出题。每行一个词，提交后其他人看不到答案。</p><textarea id="customInput" rows="4" maxlength="1000" placeholder="长颈鹿&#10;新加坡&#10;冰淇淋"></textarea><button id="addWords" class="secondary">提交词语</button><p id="customCount"></p></div></div><button id="start">开始游戏</button></div><div class="card canvaswrap"><canvas id="board" width="600" height="650"></canvas><div id="overlay">等待开始</div><div id="tools" hidden><label>颜色 <input type="color" id="color" value="#111827"></label><label>粗细 <input type="range" id="size" min="2" max="24" value="5"></label><button id="eraser" class="secondary">橡皮擦</button><button id="clear" class="ghost">清空</button></div></div><div class="card"><h3>🏆 玩家排行</h3><div id="players"></div></div><div class="card"><h3>💬 猜词聊天</h3><div id="messages"></div><form id="guessForm"><input id="guessInput" placeholder="输入答案"><button>发送</button></form></div></section><div id="toast"></div></main><script src="/game.js"></script></body></html>
